name: Build and distribute GeoTag Worksite Camera

on:
  push:
    branches: ["main", "v1-approved-development"]
  workflow_dispatch:

concurrency:
  group: geotag-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare permanent signing key (when repository secrets are configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/geotag-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/geotag-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((3 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.$GITHUB_RUN_NUMBER-dev"
          gradle --no-daemon -PAPP_VERSION_CODE="$VERSION_CODE" -PAPP_VERSION_NAME="$VERSION_NAME" assembleRelease

      - name: Build debug APK (until permanent signing secrets are configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' || secrets.ANDROID_KEYSTORE_PASSWORD == '' || secrets.ANDROID_KEY_ALIAS == '' || secrets.ANDROID_KEY_PASSWORD == '' }}
        run: |
          VERSION_CODE=$((3 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.$GITHUB_RUN_NUMBER-dev"
          gradle --no-daemon -PAPP_VERSION_CODE="$VERSION_CODE" -PAPP_VERSION_NAME="$VERSION_NAME" assembleDebug

      - name: Select APK and record build mode
        id: package
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$RELEASE_APK" ]; then
            echo "apk_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
            echo "build_mode=release-signed" >> "$GITHUB_OUTPUT"
          elif [ -f "$DEBUG_APK" ]; then
            echo "apk_path=$DEBUG_APK" >> "$GITHUB_OUTPUT"
            echo "build_mode=debug-temporary-signing" >> "$GITHUB_OUTPUT"
          else
            echo "No APK output found" >&2
            exit 1
          fi
          sha256sum "$(grep '^apk_path=' "$GITHUB_OUTPUT" | cut -d= -f2)" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: geotag-worksite-camera-v1-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node for Firebase CLI
        if: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Distribute to Firebase App Distribution
        if: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npm install --global firebase-tools
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "GeoTag Worksite Camera build ${{ github.run_number }} from ${{ github.sha }}"

      - name: Summarise build
        if: always()
        run: |
          {
            echo "## GeoTag Worksite Camera Android build"
            echo "- Branch: `$GITHUB_REF_NAME`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Version code: `$((3 + GITHUB_RUN_NUMBER))`"
            echo "- Release signing/Firebase distribution run only when their repository secrets are configured."
          } >> "$GITHUB_STEP_SUMMARY"
